name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-0.1.0 to publish MoonUUID 0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9
  MODULE_NAME: wulisususu/moonuuid
  MODULE_VERSION: 0.1.0

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish-0.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Verify release source
        shell: bash
        run: |
          grep -q '^name = "wulisususu/moonuuid"$' moon.mod
          grep -q '^version = "0.1.0"$' moon.mod

          # `moon update` must not move the pinned dependency graph.
          git diff --exit-code -- moon.mod

          moon fmt --check

          # First pass installs exactly the dependency set pinned in moon.mod ...
          moon check --target native --deny-warn
          # ... the frozen pass then proves no further dependency sync is needed.
          moon check --frozen --target native --deny-warn

          moon test --target native
          moon info --target native

      - name: Verify publication archive
        shell: bash
        run: |
          PACKAGE_LIST="$RUNNER_TEMP/moonuuid-package-list.txt"
          moon package --frozen --list 2>&1 | tee "$PACKAGE_LIST"
          grep -q '^README.md$' "$PACKAGE_LIST"
          grep -q '^LICENSE$' "$PACKAGE_LIST"
          grep -q '^docs/API.md$' "$PACKAGE_LIST"
          grep -q '^docs/DIFFERENTIATION.md$' "$PACKAGE_LIST"
          grep -q '^docs/COMPATIBILITY.md$' "$PACKAGE_LIST"
          grep -q '^examples/web_request_id/main.mbt$' "$PACKAGE_LIST"
          grep -q '^examples/database_key/main.mbt$' "$PACKAGE_LIST"
          grep -q '^examples/deterministic_resource_id/main.mbt$' "$PACKAGE_LIST"
          grep -q '^examples/interop/main.mbt$' "$PACKAGE_LIST"
          if grep -Eq '^benchmarks/|^\.github/' "$PACKAGE_LIST"; then
            echo "development-only files leaked into the Mooncakes archive"
            exit 1
          fi

      - name: Publish to Mooncakes
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "${MOONCAKES_TOKEN:-}" ]; then
            echo "::error::Repository secret MOONCAKES_TOKEN is not configured."
            exit 1
          fi

          mkdir -p "$HOME/.moon"
          umask 077
          printf '{"username":"wulisususu","token":"%s"}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT

          # A published Mooncakes version is immutable, so a re-run after a later
          # step failed must continue with the smoke test instead of aborting here.
          if moon view "$MODULE_NAME@$MODULE_VERSION" >/dev/null 2>&1; then
            echo "::warning::$MODULE_NAME@$MODULE_VERSION is already published; skipping the upload."
            exit 0
          fi

          # NOTE: `moon publish --frozen` cannot be used for this module.
          # `moon publish` re-verifies the packaged archive by extracting it into
          # an empty directory and running `moon check` there. That fresh project
          # has an empty `.mooncakes`, so the pinned registry dependency
          # (`moonbitlang/x@0.5.5`) still has to be installed, and `--frozen`
          # forbids exactly that. The run then dies inside the CLI's own
          # verification step (exit code 255) before anything is uploaded.
          # The frozen build plan is asserted by `moon check --frozen` and
          # `moon package --frozen --list` above instead, so the published
          # archive is still produced from the frozen, pinned dependency set.
          PUBLISH_LOG="$RUNNER_TEMP/moon-publish.log"
          if ! moon publish 2>&1 | tee "$PUBLISH_LOG"; then
            echo "::error::moon publish failed: $(tail -n 4 "$PUBLISH_LOG" | tr '\n' ' ')"
            exit 1
          fi

      - name: Smoke test registry installation
        shell: bash
        run: |
          SMOKE="$RUNNER_TEMP/moonuuid-registry-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE"
          cd "$SMOKE"

          cat > moon.mod <<'EOF'
          name = "smoke/moonuuid_consumer"

          version = "0.0.0"
          EOF
          cp moon.mod moon.mod.pristine

          # The registry index can lag a few seconds behind a successful publish,
          # so retry the real consumer install path instead of failing a release
          # whose module is already live.
          installed=0
          for attempt in $(seq 1 12); do
            if moon add "$MODULE_NAME@$MODULE_VERSION"; then
              installed=1
              break
            fi
            cp moon.mod.pristine moon.mod
            echo "Mooncakes does not serve $MODULE_NAME@$MODULE_VERSION yet (attempt $attempt/12); retrying in 10s"
            sleep 10
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install $MODULE_NAME@$MODULE_VERSION from Mooncakes"
            exit 1
          fi
          grep -q "\"$MODULE_NAME@$MODULE_VERSION\"" moon.mod

          mkdir -p cmd/main

          cat > cmd/main/moon.pkg <<'EOF'
          import {
            "wulisususu/moonuuid" @uuid,
          }

          pkgtype(kind: "executable")
          EOF

          cat > cmd/main/main.mbt <<'EOF'
          ///|
          fn main {
            let value = "017f22e2-79b0-7cc3-98c4-dc0c0c07398f"
            match @uuid.parse(value) {
              Err(_) => abort("registry-installed MoonUUID failed to parse RFC vector")
              Ok(id) => {
                if @uuid.to_string(id) != value {
                  abort("registry-installed MoonUUID failed canonical round trip")
                }
                println(@uuid.to_string(id))
              }
            }
          }
          EOF

          moon tree
          moon check --target native --deny-warn
          moon run cmd/main --target native

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$MODULE_VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$MODULE_VERSION already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "v$MODULE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "MoonUUID v$MODULE_VERSION" \
            --notes-file - <<'EOF'
          First public release of MoonUUID.

          Highlights:
          - RFC 9562 UUID v3, v4, v5, v6, v7 and v8 support
          - secure default entropy with no weak-random fallback
          - injectable clock and entropy providers
          - monotonic UUIDv7 with clock-rollback and overflow handling
          - canonical, URN, braced and 16-byte interoperability
          - wasm, wasm-gc, JavaScript, Linux native and Windows native CI
          EOF
