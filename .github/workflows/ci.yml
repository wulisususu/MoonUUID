name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  cross-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Test
        run: moon test --target ${{ matrix.target }}

      - name: Build
        run: moon build --target ${{ matrix.target }}

  release-readiness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL \
            https://cli.moonbitlang.com/install/unix.sh \
            | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Formatting
        run: moon fmt --check

      - name: Public interface
        run: moon info --target native

      - name: Package contents
        run: moon package --list

      - name: Run examples
        run: |
          moon run examples/web_request_id --target native
          moon run examples/database_key --target native
          moon run examples/deterministic_resource_id --target native
          moon run examples/interop --target native

      - name: Native release benchmarks
        run: moon bench benchmarks --release --target native --deny-warn

  native-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          $script = Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1
          Invoke-Expression $script
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check native
        run: moon check --target native --deny-warn

      - name: Test native
        run: moon test --target native
